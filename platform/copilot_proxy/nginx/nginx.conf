worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # We assume sidecar is reachable via Docker Compose DNS as "sidecar:8080"
    upstream sidecar_service {
        server sidecar:8080;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # Set the root directory to where the registration folder is located.
        root /usr/share/nginx/html;

        # Serve the captive portal from the /registration/ folder.
        location ^~ /registration {
            try_files $uri $uri/ =404;
        }

        ssl_certificate     nginx.crt;
        ssl_certificate_key nginx.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
        ssl_session_tickets off;

       	# mozilla scan recommendations - https://observatory.mozilla.org/
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        # add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; form-action 'self'; frame-ancestors 'self';" always;

       	# intermediate configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

       	# HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

       	# OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # 1) Auth request location: NGINX calls this before serving /.
        # Internal location for sidecar authentication.
        location = /auth_proxy {
            internal;  # not accessible from the outside
            proxy_pass         http://sidecar_service/validate;
            proxy_set_header   X-Original-URI $request_uri;
            proxy_set_header   X-Forwarded-For $remote_addr;

            # We'll read back the custom header "Session-Cookie"
            # that the sidecar returns if authentication is OK (200).
            # If the sidecar returns 401/403, NGINX denies the request.
        }

        # 2) Actual location for the app
        location / {
            # Check for captive portal cookies; if missing, redirect to /registration.
            if ($http_cookie !~* "captive_auth=1") {
                return 302 /registration;
            }
            if ($http_cookie !~* "businessEmail=") {
                return 302 /registration;
            }

            # Proceed with the standard authentication flow.
            auth_request /auth_proxy;

            # If authentication fails, we can define an error page or
            # just let the user see 401/403 from the sidecar.
            error_page 401 = @auth_error;
            error_page 403 = @auth_error;

            # Capture the cookie from the sidecar's response headers
            # Use the variable name we want: 'session_cookie_from_sidecar'
            auth_request_set $combined_cookie $upstream_http_session_cookie;
            auth_request_set $user_id $upstream_http_x_user_id;

            # Now set the Cookie header for the real request to the backend
            proxy_set_header Cookie $combined_cookie;
            proxy_pass https://cplt.demo.aviatrixtest.com;
            proxy_ssl_verify off;
            # Remove the CoPilot Pendo snippet
            # Inject the demo.aviatrix.com Pendo snippet.
            sub_filter_once on;
            sub_filter_types text/html;
            sub_filter 'content="Aviatrix - CoPilot"' 'content="Aviatrix Interactive Demo"';
            sub_filter '<title>Aviatrix CoPilot' '<title>Aviatrix Interactive Demo';
        }

        location ~ ^/assets/index-[A-Za-z0-9]+\.js$ {
            # Forward the request to the same backend
            proxy_pass https://cplt.demo.aviatrixtest.com;
            proxy_ssl_verify off;
            proxy_set_header Cookie $combined_cookie;
            
            # Enable JavaScript modification
            sub_filter_types application/javascript;
            sub_filter_once on;
            
            # Ensure content is not compressed so we can modify it
            proxy_set_header Accept-Encoding "";
            proxy_hide_header Content-Length;
            
            # Your JavaScript replacements
            # Example: Replace a specific function or code snippet
            # sub_filter 'originalFunction(' 'modifiedFunction(';
            sub_filter 'pendo_key_1' 'pendo_key_2';
            sub_filter 'function pendoInitUser({username:_e,email:Fr,domain:Br}){if(!window.pendo){console.error("Pendo is not loaded");return}if(!_e){console.warn("No user id found; no data collection");return}const Ur={visitor:{id:Fr||_e,email:Fr,userid:_e},account:getAccountInfo(Br)};window.pendo.isReady()?window.pendo.updateOptions(Ur):window.pendo.initialize(Ur)}' 'function pendoInitUser({username:_e,email:Fr,domain:Br}){if(!window.pendo){console.error("Pendo is not loaded");return;}if(!_e){console.warn("No user id found; no data collection");return;}function getCookie(name){var match=document.cookie.match(new RegExp("(^| )"+name+"=([^;]+)"));return match?decodeURIComponent(match[2]):null;}var userEmailCookie=getCookie("user_businessEmail");var email=userEmailCookie?atob(userEmailCookie):Fr;var visitorId=userEmailCookie?"demo-user-"+userEmailCookie:_e;var organization=email&&email.includes("@")?email.split("@")[1].replace(/\./g,"-"):(Br||null);var role=getCookie("user_role")?atob(getCookie("user_role")):null;var industry=getCookie("user_industry")?atob(getCookie("user_industry")):null;const Ur={visitor:{id:visitorId,email:email,userid:_e,industry:industry,role:role},account:{id:organization}};window.pendo.isReady()?window.pendo.updateOptions(Ur):window.pendo.initialize(Ur);}';

            # Prevent caching issues
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        location @auth_error {
            return 401 "Unauthorized - sidecar authentication failed\n";
        }
    }
}
