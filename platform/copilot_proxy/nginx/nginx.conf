worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # We assume sidecar is reachable via Docker Compose DNS as "sidecar:8080"
    upstream sidecar_service {
        server sidecar:8080;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;
        ssl_certificate     nginx.crt;
        ssl_certificate_key nginx.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
        ssl_session_tickets off;

       	# mozilla scan recommendations - https://observatory.mozilla.org/
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        # add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; form-action 'self'; frame-ancestors 'self';" always;

       	# intermediate configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

       	# HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

       	# OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # 1) Auth request location: NGINX calls this before serving /.
        location = /auth_proxy {
            internal;  # not accessible from the outside
            proxy_pass         http://sidecar_service/validate;
            proxy_set_header   X-Original-URI $request_uri;
            proxy_set_header   X-Forwarded-For $remote_addr;

            # We'll read back the custom header "Session-Cookie"
            # that the sidecar returns if authentication is OK (200).
            # If the sidecar returns 401/403, NGINX denies the request.
        }

        # 2) Actual location for the app
        location / {

            # Call the auth_request location first
            auth_request /auth_proxy;

            # If authentication fails, we can define an error page or
            # just let the user see 401/403 from the sidecar.
            error_page 401 = @auth_error;
            error_page 403 = @auth_error;

            # Capture the cookie from the sidecar's response headers
            # Use the variable name we want: 'session_cookie_from_sidecar'
            auth_request_set $combined_cookie $upstream_http_session_cookie;
            auth_request_set $user_id $upstream_http_x_user_id;

            # Now set the Cookie header for the real request to the backend
            proxy_set_header Cookie $combined_cookie;

            # For demonstration, let's say the backend is at backend.example.com
            # or maybe you have another Docker Compose service. We'll assume
            # we can do a direct "proxy_pass" to some URL.
            proxy_pass https://demo.aviatrix.com;
            proxy_ssl_verify off;  # If self-signed or testing
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' cdn.pendo.io data.pendo.io app.pendo.io *.storage.googleapis.com" always;

            sub_filter </body>
            "<script>
(function(apiKey){

  // Helper function: Get cookie by name
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
  }

  // Helper function: Set cookie (defaults to 365-day expiration)
  function setCookie(name, value, days) {
    var d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    var expires = 'expires=' + d.toUTCString();
    document.cookie = name + '=' + value + ';' + expires + ';path=/;domain=.demo-avx.com';
  }

  // Helper function: Generate a random string of specified length
  function generateRandomString(length) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    var result = '';
    for (var i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  // Check for existing user ID in cookie
  var userId = getCookie('avx_demo_user_id');
  if (!userId) {
    // Not found? Generate a new one and save it
    userId = 'demo-' + generateRandomString(10);
    setCookie('avx_demo_user_id', userId, 365);  // Store for 365 days
  }

  // Standard Pendo snippet
  (function(p,e,n,d,o){
    var v,w,x,y,z;
    o = p[d] = p[d] || {};
    o._q = o._q || [];
    v = ['initialize','identify','updateOptions','pageLoad','track'];
    for (w=0,x=v.length; w<x; ++w) (function(m){
      o[m] = o[m] || function(){
        o._q[m===v[0] ? 'unshift' : 'push']([m].concat([].slice.call(arguments,0)));
      };
    })(v[w]);
    y=e.createElement(n); y.async=!0; y.src='https://cdn.pendo.io/agent/static/'+apiKey+'/pendo.js';
    z=e.getElementsByTagName(n)[0]; z.parentNode.insertBefore(y,z);
  })(window, document, 'script', 'pendo');

  // Initialize with the dynamic userId from cookie
  pendo.initialize({
    visitor: {
      id: userId
    },
    account: {
      id: 'public-demo-account'
    }
  });

})('pendo_key');
</script></body>";
            sub_filter_once on;
            
        }
        # 3) A simple error handler for 401/403
        location @auth_error {
            return 401 "Unauthorized - sidecar authentication failed\n";
        }
    }
}
